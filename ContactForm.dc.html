<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/js/support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; font-family: {{ font }}; color: {{ ink }};">
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 12px; padding: clamp(24px, 3vw, 40px); border-radius: {{ radius }}; background: {{ field }}; border: 1px solid {{ line }};">
      <span style="font-size: clamp(1.3rem, 2vw, 1.7rem); font-weight: 600; letter-spacing: -0.02em;">Thanks, your message is in.</span>
      <span style="font-size: 1rem; line-height: 1.55; color: {{ muted }}; text-wrap: pretty;">A confirmation is on its way to your inbox. {{ reply }}.</span>
    </div>
  </sc-if>
  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <form action="https://formsubmit.co/filipnote4@gmail.com" method="POST" enctype="multipart/form-data" onSubmit="{{ onSubmit }}" style="display: flex; flex-direction: column; gap: 18px; padding: clamp(22px, 3vw, 40px); border-radius: {{ radius }}; background: {{ field }}; border: 1px solid {{ line }}; box-sizing: border-box;">
      <input type="hidden" name="_subject" value="New project enquiry from the portfolio">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_autoresponse" value="Thanks for reaching out. Your message reached me and I will get back to you soon. Filip Ćorić, UI/UX & Web Designer">
      <input type="hidden" name="_next" value="{{ nextUrl }}">
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; font-weight: 500;">
        <span>Name</span>
        <input name="name" required="" autocomplete="name" style="font: inherit; font-weight: 400; font-size: 1rem; color: {{ ink }}; background: {{ input }}; border: 1px solid {{ line }}; border-radius: {{ radiusSm }}; padding: 14px 16px; outline: none;" style-focus="border-color: {{ accent }};">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; font-weight: 500;">
        <span>Email</span>
        <input name="email" type="email" required="" autocomplete="email" style="font: inherit; font-weight: 400; font-size: 1rem; color: {{ ink }}; background: {{ input }}; border: 1px solid {{ line }}; border-radius: {{ radiusSm }}; padding: 14px 16px; outline: none;" style-focus="border-color: {{ accent }};">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; font-weight: 500;">
        <span>What are you building?</span>
        <textarea name="message" rows="5" required="" style="font: inherit; font-weight: 400; font-size: 1rem; line-height: 1.5; color: {{ ink }}; background: {{ input }}; border: 1px solid {{ line }}; border-radius: {{ radiusSm }}; padding: 14px 16px; outline: none; resize: vertical; min-height: 130px;" style-focus="border-color: {{ accent }};"></textarea>
      </label>
      <label style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px 16px; border: 1px dashed {{ line }}; border-radius: {{ radiusSm }}; font-size: 0.95rem; font-weight: 500; cursor: pointer; text-align: center;" style-hover="border-color: {{ accent }};">
        <i class="ph-duotone ph-paperclip" style="font-size: 1.2rem; color: {{ accent }};"></i>
        <span>{{ fileLabel }}</span>
        <input type="file" name="attachment" onChange="{{ onFile }}" style="position: absolute; inset: 0; opacity: 0; cursor: pointer;">
      </label>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 4px;">
        <button type="submit" style="font: inherit; font-size: 1rem; font-weight: 600; color: {{ onAccent }}; background: {{ accent }}; border: 0; border-radius: {{ radiusBtn }}; padding: 16px 30px; min-height: 52px; min-width: 200px; cursor: pointer;" style-hover="filter: brightness(1.08);">Send message</button>
        <span style="font-size: 0.85rem; color: {{ muted }};">{{ reply }}</span>
      </div>
    </form>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:720},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b8801f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;font&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;system-ui, sans-serif&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:32},&quot;pill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onAccent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;panel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;inputBg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;reply&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;I usually reply within 24 hours&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { files: '' };
  renderVals() {
    const p = this.props;
    const dark = !!p.dark;
    const accent = p.accent || '#b8801f';
    const sent = typeof location !== 'undefined' && /[?&]sent=1/.test(location.search);
    const base = typeof location !== 'undefined' ? location.href.split('#')[0].split('?')[0] : '';
    return {
      font: p.font || 'system-ui, sans-serif',
      ink: dark ? '#f4efe6' : '#1d1b19',
      muted: dark ? 'rgba(244,239,230,0.68)' : 'rgba(29,27,25,0.62)',
      field: dark ? 'rgba(255,255,255,0.04)' : (p.panel || '#ffffff'),
      input: dark ? 'rgba(255,255,255,0.06)' : (p.inputBg || '#f6f5f2'),
      line: dark ? 'rgba(244,239,230,0.16)' : 'rgba(29,27,25,0.14)',
      accent,
      onAccent: p.onAccent || (dark ? '#141210' : '#ffffff'),
      radius: (p.radius ?? 20) + 'px',
      radiusSm: Math.max(4, (p.radius ?? 20) * 0.5) + 'px',
      radiusBtn: p.pill ? '999px' : Math.max(4, (p.radius ?? 20) * 0.5) + 'px',
      reply: p.reply || (window.PF && window.PF.reply) || 'I usually reply within 24 hours',
      sent, notSent: !sent,
      nextUrl: base + '?sent=1#contact',
      fileLabel: this.state.files || 'Add files (PDF, images, video)',
      onFile: (e) => {
        const f = Array.from(e.target.files || []).map((x) => x.name).join(', ');
        this.setState({ files: f });
      },
      onSubmit: () => {}
    };
  }
}

</script>
</body>
</html>
