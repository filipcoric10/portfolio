  html, body { margin: 0; padding: 0; background: var(--color-bg); }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-2); }
  @keyframes bs-press {
    0%, 56%, 84%, 100% { transform: none; }
    62% { transform: scale(0.945) translateY(0.06em); }
    70% { transform: scale(0.975) translateY(0.02em); }
  }
  @keyframes bs-ripple {
    0%, 55% { opacity: 0; transform: scale(0.35); }
    61% { opacity: 0.5; transform: scale(0.55); }
    88%, 100% { opacity: 0; transform: scale(1.75); }
  }
  @keyframes bs-path {
    0% { offset-distance: 0%; opacity: 0; }
    5% { opacity: 1; }
    58% { offset-distance: 100%; opacity: 1; }
    64% { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes bs-wing {
    0%, 100% { transform: rotate(-14deg) scaleY(1); }
    50% { transform: rotate(-44deg) scaleY(0.7); }
  }
  [data-strip="1"]::-webkit-scrollbar { display: none; }
  [data-strip="1"] image-slot::part(frame) { background: transparent; }
  @keyframes bs-rise {
    from { opacity: 0; transform: translateY(0.5em); }
    to { opacity: 1; transform: none; }
  }
  @keyframes bs-tap {
    0%, 46% { opacity: 0; transform: translateY(1.1em) scale(0.85); }
    57% { opacity: 0.85; transform: translateY(0.25em) scale(1); }
    64% { opacity: 0.9; transform: translateY(0.02em) scale(0.9); }
    78% { opacity: 0; transform: translateY(0.7em) scale(1); }
    100% { opacity: 0; transform: translateY(1.1em) scale(0.85); }
  }
</style>

    };
    const R = 190;
    const baseOp = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hx-op')) || 0.22;
    const lift = (works, mx, my) => {
      const b0 = baseOp();
      cells.forEach((c) => {
        if (c.works !== works) { if (c.lifted) { c.el.style.removeProperty('transform'); c.el.style.removeProperty('opacity'); c.lifted = false; } return; }
        const d = Math.hypot(c.x - mx, c.y - my);
        if (d < R) {
          const f = 1 - d / R;
          c.el.style.transform = 'translateY(' + (-16 * f).toFixed(1) + 'px) scale(' + (1 + 0.09 * f).toFixed(3) + ')';
          c.el.style.opacity = Math.min(1, b0 + 0.4 * f).toFixed(3);
          c.lifted = true;
        } else if (c.lifted) {
          c.el.style.removeProperty('transform');
          c.el.style.removeProperty('opacity');
          c.lifted = false;
        }
      });
    };
    this._onMove = (ev) => {
      const works = ev.currentTarget;
      const r = works.getBoundingClientRect();
      lift(works, ev.clientX - r.left, ev.clientY - r.top);
    };
    this._onLeave = () => { cells.forEach((c) => { if (c.lifted) { c.el.style.removeProperty('transform'); c.el.style.removeProperty('opacity'); c.lifted = false; } }); };
    setTimeout(() => {
      measure();
      combs().forEach((w) => {
        w.addEventListener('pointermove', this._onMove);
        w.addEventListener('pointerleave', this._onLeave);
      });
    }, 60);
    this._measure = measure;
    let queued = false;
    this._onScroll = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; melt(); });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onScroll);
    window.addEventListener('resize', () => this._measure && this._measure());
    melt();
  }
  componentWillUnmount() {
    document.querySelectorAll('[data-strip="1"]').forEach((st) => { if (st._raf) cancelAnimationFrame(st._raf); });
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onScroll);
  }
  dark = false;
  renderVals() {
    const secs = Number(this.props.loopSeconds ?? 4.2);
    return {
      loopDur: secs + 's',
      shellRef: this.shellRef,
      onToggleTheme: (e) => {
        const el = document.documentElement;
        this.dark = !this.dark;
        const dark = {
          '--hero-paper': '#221f1a',
          '--hero-ink': '#d59a2b',
          '--hero-touch': '#f4e3bd',
          '--hero-sub': '#f6ecd6',
          '--hero-gap': '#b8801f',
          '--hx-fill': '#b8801f',
          '--hx-op': '1',
          '--hero-glow': '2px 0 0 #221f1a, -2px 0 0 #221f1a, 0 2px 0 #221f1a, 0 -2px 0 #221f1a, 1.5px 1.5px 0 #221f1a, -1.5px 1.5px 0 #221f1a, 1.5px -1.5px 0 #221f1a, -1.5px -1.5px 0 #221f1a',
          '--hero-glow-sm': '1.5px 0 0 #221f1a, -1.5px 0 0 #221f1a, 0 1.5px 0 #221f1a, 0 -1.5px 0 #221f1a, 1px 1px 0 #221f1a, -1px 1px 0 #221f1a, 1px -1px 0 #221f1a, -1px -1px 0 #221f1a',
          '--hero-rim': 'clamp(2px, 0.42vw, 7px)',
          '--hero-ring': '#f4e3bd',
          '--hero-ring-2': 'rgba(244,227,189,0.45)',
          '--color-neutral-200': '#2e2a24'
        };
        Object.keys(dark).forEach((k) => {
          if (this.dark) el.style.setProperty(k, dark[k]);
          else el.style.removeProperty(k);
        });
        document.body.style.background = this.dark ? dark['--hero-paper'] : '';
        document.querySelectorAll('[data-hx="1"]').forEach((h) => { h.style.removeProperty('opacity'); h.style.removeProperty('transform'); });
      },
      onPress: (e) => {
        const el = e.currentTarget;
        el.style.animation = 'none';
        el.style.transform = 'scale(0.945) translateY(0.06em)';
      },
      onRelease: (e) => {
        const el = e.currentTarget;
        el.style.transform = '';
        el.style.animation = '';
      }
    };
  }
}

</script>
