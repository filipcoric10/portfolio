<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/js/support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family: {{ font }};">
  <sc-if value="{{ booked }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 14px 18px; border-radius: 14px; background: {{ panel }}; color: {{ ink }}; border: 1px solid {{ line }}; box-shadow: 0 18px 50px rgba(0,0,0,0.22); font-size: 0.95rem; line-height: 1.4;">
      <i class="ph-duotone ph-check-circle" style="font-size: 1.5rem; color: {{ accent }};"></i>
      <span>Call requested. A confirmation is on its way to your inbox.</span>
      <button type="button" onClick="{{ dismiss }}" aria-label="Dismiss" style="font: inherit; background: none; border: 0; color: {{ muted }}; cursor: pointer; font-size: 1.1rem; padding: 4px;">✕</button>
    </div>
  </sc-if>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ backdrop }}" style="position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: rgba(12,11,10,0.58); backdrop-filter: blur(6px);">
      <div role="dialog" aria-modal="true" aria-label="Book a free call" onClick="{{ stop }}" style="width: 100%; max-width: 620px; max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; border-radius: {{ radius }}; background: {{ panel }}; color: {{ ink }}; border: 1px solid {{ line }}; box-shadow: 0 30px 80px rgba(0,0,0,0.35); padding: clamp(22px, 3.4vw, 40px); display: flex; flex-direction: column; gap: 22px;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: clamp(1.4rem, 2.6vw, 1.9rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1;">Book a free intro call</span>
            <span style="font-size: 0.98rem; line-height: 1.5; color: {{ muted }}; text-wrap: pretty;">No strings attached. Pick a time that suits you and I'll send the link.</span>
          </div>
          <button type="button" onClick="{{ close }}" aria-label="Close" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{ line }}; background: transparent; color: {{ ink }}; font: inherit; font-size: 1.1rem; cursor: pointer;">✕</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{ muted }};">{{ monthLabel }}</span>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px;">
            <sc-for list="{{ days }}" as="d" hint-placeholder-count="10">
              <button type="button" disabled="{{ d.full }}" onClick="{{ d.pick }}" style="font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; padding: 8px 4px; border-radius: {{ radiusSm }}; border: 1px solid {{ d.border }}; background: {{ d.bg }}; color: {{ d.fg }}; cursor: {{ d.cursor }}; opacity: {{ d.op }};">
                <span style="font-size: 0.78rem; font-weight: 500;">{{ d.dow }}</span>
                <span style="font-size: 1.15rem; font-weight: 600;">{{ d.num }}</span>
                <span style="font-size: 0.68rem;">{{ d.note }}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{ muted }};">{{ dayLabel }} · CET</span>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px;">
            <sc-for list="{{ slots }}" as="s" hint-placeholder-count="8">
              <button type="button" disabled="{{ s.busy }}" onClick="{{ s.pick }}" style="font: inherit; min-height: 46px; border-radius: {{ radiusSm }}; border: 1px solid {{ s.border }}; background: {{ s.bg }}; color: {{ s.fg }}; font-size: 0.95rem; font-weight: 500; text-decoration: {{ s.deco }}; cursor: {{ s.cursor }}; opacity: {{ s.op }};">{{ s.t }}</button>
            </sc-for>
          </div>
        </div>
        <form action="https://formsubmit.co/filipnote4@gmail.com" method="POST" style="display: flex; flex-direction: column; gap: 12px;">
          <input type="hidden" name="_subject" value="{{ subject }}">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_autoresponse" value="{{ autoresponse }}">
          <input type="hidden" name="_next" value="{{ nextUrl }}">
          <input type="hidden" name="requested_time" value="{{ chosen }}">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px;">
            <input name="name" required="" placeholder="Your name" autocomplete="name" style="font: inherit; font-size: 1rem; color: {{ ink }}; background: {{ input }}; border: 1px solid {{ line }}; border-radius: {{ radiusSm }}; padding: 14px 16px; outline: none; min-width: 0;" style-focus="border-color: {{ accent }};">
            <input name="email" type="email" required="" placeholder="Email" autocomplete="email" style="font: inherit; font-size: 1rem; color: {{ ink }}; background: {{ input }}; border: 1px solid {{ line }}; border-radius: {{ radiusSm }}; padding: 14px 16px; outline: none; min-width: 0;" style-focus="border-color: {{ accent }};">
          </div>
          <button type="submit" disabled="{{ noSlot }}" style="font: inherit; font-size: 1rem; font-weight: 600; min-height: 54px; border: 0; border-radius: {{ radiusBtn }}; background: {{ accent }}; color: {{ onAccent }}; cursor: pointer; opacity: {{ submitOp }};">{{ submitLabel }}</button>
        </form>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:820},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b8801f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAccent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;font&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;system-ui, sans-serif&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:32},&quot;pill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { day: -1, slot: '', dismissed: false };
  componentDidMount() {
    this._key = (e) => { if (e.key === 'Escape' && this.props.open && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }
  hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
  buildDays() {
    const out = []; const d = new Date(); d.setHours(0, 0, 0, 0);
    while (out.length < 10) {
      d.setDate(d.getDate() + 1);
      const wd = d.getDay(); if (wd === 0 || wd === 6) continue;
      const key = d.toISOString().slice(0, 10);
      const slots = ['09:00', '10:00', '11:00', '12:00', '14:00', '15:00', '16:00', '17:00'].map((t) => ({ t, busy: this.hash(key + t) % 2 === 0 }));
      const full = this.hash(key) % 4 === 0;
      if (full) slots.forEach((s) => { s.busy = true; });
      if (!full && slots.every((s) => s.busy)) slots[3].busy = false;
      out.push({ date: new Date(d), key, full, slots });
    }
    return out;
  }
  renderVals() {
    const p = this.props; const dark = !!p.dark; const accent = p.accent || '#b8801f';
    const ink = dark ? '#f4efe6' : '#1d1b19';
    const line = dark ? 'rgba(244,239,230,0.16)' : 'rgba(29,27,25,0.14)';
    const muted = dark ? 'rgba(244,239,230,0.66)' : 'rgba(29,27,25,0.6)';
    const onAccent = p.onAccent || (dark ? '#141210' : '#ffffff');
    if (!this._days) this._days = this.buildDays();
    const days = this._days;
    let di = this.state.day;
    if (di < 0 || days[di].full) di = days.findIndex((x) => !x.full);
    const cur = days[di];
    const fmtD = (dt) => dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const chosen = this.state.slot && cur ? fmtD(cur.date) + ', ' + this.state.slot + ' CET' : '';
    const base = typeof location !== 'undefined' ? location.href.split('#')[0].split('?')[0] : '';
    const booked = !this.state.dismissed && typeof location !== 'undefined' && /[?&]booked=1/.test(location.search);
    const r = p.radius ?? 20;
    return {
      font: p.font || 'system-ui, sans-serif', ink, line, muted, accent, onAccent,
      panel: dark ? '#17150f' : '#ffffff', input: dark ? 'rgba(255,255,255,0.06)' : '#f6f5f2',
      radius: r + 'px', radiusSm: Math.max(4, r * 0.5) + 'px', radiusBtn: p.pill ? '999px' : Math.max(4, r * 0.5) + 'px',
      open: !!p.open, booked,
      monthLabel: days[0].date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }),
      dayLabel: cur ? cur.date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : '',
      days: days.map((x, i) => {
        const on = i === di;
        return {
          dow: x.date.toLocaleDateString('en-GB', { weekday: 'short' }), num: x.date.getDate(),
          note: x.full ? 'Booked' : (x.slots.filter((s) => !s.busy).length + ' free'), full: x.full,
          bg: on ? accent : 'transparent', fg: on ? onAccent : ink, border: on ? accent : line,
          cursor: x.full ? 'not-allowed' : 'pointer', op: x.full ? 0.38 : 1,
          pick: () => this.setState({ day: i, slot: '' })
        };
      }),
      slots: (cur ? cur.slots : []).map((s) => {
        const on = s.t === this.state.slot;
        return {
          t: s.t, busy: s.busy, bg: on ? accent : 'transparent', fg: on ? onAccent : ink, border: on ? accent : line,
          deco: s.busy ? 'line-through' : 'none', cursor: s.busy ? 'not-allowed' : 'pointer', op: s.busy ? 0.35 : 1,
          pick: () => this.setState({ slot: s.t })
        };
      }),
      chosen, noSlot: !chosen, submitOp: chosen ? 1 : 0.45,
      submitLabel: chosen ? 'Request ' + chosen : 'Pick a time first',
      subject: 'Call request: ' + (chosen || '—'),
      autoresponse: 'Thanks for booking a call' + (chosen ? ' for ' + chosen : '') + '. I will confirm the time and send the meeting link shortly. Filip Ćorić',
      nextUrl: base + '?booked=1',
      close: () => p.onClose && p.onClose(),
      backdrop: () => p.onClose && p.onClose(),
      stop: (e) => e.stopPropagation(),
      dismiss: () => this.setState({ dismissed: true })
    };
  }
}

</script>
</body>
</html>
